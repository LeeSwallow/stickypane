<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!-- The tray icon: the app icon's three notes as a macOS template image,
       black and alpha only, drawn like the icon in crayon: a thick outline
       whose sides bow a little, and hatching at -41 degrees over a light
       wash. Each note knocks a gap out of the ones below, so the stack
       reads at 18 points. Rebuild the PNGs with overlay/build/darwin/tray.sh. -->
  <defs>
    <path id="blue" d="M3.8 15.4 Q10.4 13.6 17.2 12.7 Q18.9 21.4 20.2 30.2 Q13.4 31.8 6.5 32.6 Q4.9 24.1 3.8 15.4 Z"/>
    <path id="red" d="M7.7 11.2 Q15.1 9.2 22.4 8.0 Q24.2 16.8 25.6 25.6 Q18.3 27.6 10.9 28.6 Q9.1 19.9 7.7 11.2 Z"/>
    <path id="yellow" d="M12.3 6.6 Q21.3 4.6 30.2 3.8 Q31.6 11.1 32.4 18.3 Q30.1 21.1 27.5 23.4 Q21.3 25.1 15.1 25.6 Q13.4 16.1 12.3 6.6 Z"/>
    <path id="fold" d="M32.4 18.3 Q29.8 18.5 27.3 19.3 Q27.6 21.3 27.5 23.4"/>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="2.6" height="2.6" patternTransform="rotate(-41)">
      <rect x="0" y="0" width="1.05" height="2.6" fill="#000"/>
    </pattern>
    <clipPath id="in-blue"><use href="#blue"/></clipPath>
    <clipPath id="in-red"><use href="#red"/></clipPath>
    <clipPath id="in-yellow"><use href="#yellow"/></clipPath>
    <mask id="under-red" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
      <rect width="36" height="36" fill="#fff"/>
      <use href="#red" fill="#000" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
      <use href="#yellow" fill="#000" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
    </mask>
    <mask id="under-yellow" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
      <rect width="36" height="36" fill="#fff"/>
      <use href="#yellow" fill="#000" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g mask="url(#under-red)">
    <use href="#blue" fill="#000" fill-opacity="0.18"/>
    <rect width="36" height="36" fill="url(#hatch)" fill-opacity="0.6" clip-path="url(#in-blue)"/>
    <use href="#blue" fill="none" stroke="#000" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <g mask="url(#under-yellow)">
    <use href="#red" fill="#000" fill-opacity="0.22"/>
    <rect width="36" height="36" fill="url(#hatch)" fill-opacity="0.75" clip-path="url(#in-red)"/>
    <use href="#red" fill="none" stroke="#000" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <use href="#yellow" fill="#000" fill-opacity="0.28"/>
  <rect width="36" height="36" fill="url(#hatch)" clip-path="url(#in-yellow)"/>
  <use href="#yellow" fill="none" stroke="#000" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <use href="#fold" fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
