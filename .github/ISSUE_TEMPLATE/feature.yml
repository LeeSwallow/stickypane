name: Feature request
description: Something the board should be able to do.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you cannot do today, and when it comes up.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What you would like
      description: The behaviour, a command, a key, a file format. A text mockup is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
  - type: dropdown
    id: contribute
    attributes:
      label: Would you be willing to contribute this?
      options:
        - "Yes, with some pointers"
        - "Maybe"
        - "No"
