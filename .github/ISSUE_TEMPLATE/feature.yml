name: Feature request
description: Something small the board should be able to do. For a change to how it behaves, open a proposal.
title: "[feature] "
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you cannot do today, and when it comes up.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What you would like
      description: The behaviour, a command, a key, a file format. A text mockup is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
  - type: dropdown
    id: contribute
    attributes:
      label: Would you be willing to contribute this?
      description: Say so and the issue is yours once it is accepted; see "Taking an issue" in CONTRIBUTING.md.
      options:
        - "Yes, with some pointers"
        - "Maybe"
        - "No"
