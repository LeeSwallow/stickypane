name: Bug report
description: Something did not work.
title: "[bug] "
labels: ["bug", "needs triage"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `stickypane version`
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal and OS
      description: e.g. WezTerm in tmux 3.5 on macOS 15; Ghostty on Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Steps, or the command and the files in `.sticky/` if they matter.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: A screenshot, the pasted screen, or the error.
    validations:
      required: true
  - type: dropdown
    id: fix
    attributes:
      label: Would you like to fix it?
      description: Say so and the issue is yours once it is accepted; see "Taking an issue" in CONTRIBUTING.md.
      options:
        - "Yes"
        - "Yes, with some pointers"
        - "No"
