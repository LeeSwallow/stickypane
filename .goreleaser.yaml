version: 2

project_name: stickypane

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/stickypane
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats:
      - tar.gz

nfpms:
  - formats:
      - rpm
      - deb
    # No version in the name, so releases/latest/download/... always works.
    file_name_template: "{{ .ProjectName }}_{{ .Arch }}"
    maintainer: LeeSwallow <noreply@github.com>
    homepage: https://github.com/LeeSwallow/stickypane
    description: A sticky-note board in your terminal, for you and your coding agent
    license: MIT
    recommends:
      - tmux
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/stickypane/LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  prerelease: auto

homebrew_casks:
  - repository:
      owner: LeeSwallow
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/LeeSwallow/stickypane
    description: A sticky-note board in your terminal, for you and your coding agent
    license: MIT
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/stickypane"]
          end
