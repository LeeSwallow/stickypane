version: 2

project_name: stickypane

before:
  hooks:
    - go mod tidy
    - sh scripts/licenses.sh

builds:
  - main: ./cmd/stickypane
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - THIRD_PARTY_NOTICES.md
      - src: build/THIRD_PARTY_LICENSES.txt
        strip_parent: true

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  prerelease: auto

homebrew_casks:
  - repository:
      owner: LeeSwallow
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # Without a token for the tap, the release is made and the cask is not.
    skip_upload: '{{ if not (index .Env "HOMEBREW_TAP_TOKEN") }}true{{ end }}'
    homepage: https://github.com/LeeSwallow/stickypane
    description: A sticky-note board in your terminal, for you and your coding agent
    license: MIT
    # The binary is not notarized: macOS kills it while it is quarantined.
    # Homebrew's postflight block is deprecated; its steps take literal
    # arguments, and xattr is absent on Linux, hence must_succeed: false.
    custom_block: |
      postflight_steps do
        run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/stickypane"], must_succeed: false
      end
